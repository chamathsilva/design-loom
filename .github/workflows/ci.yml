name: ci

on:
  push:
    branches: [main]
  pull_request:

# Read-only: CI never needs write access or secrets to verify the framework.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Design doc DL-Q04: Windows, macOS and Linux are target environments.
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node from .nvmrc
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Check Node and npm match the pinned versions
        shell: bash
        run: |
          expected_node="v$(tr -d '[:space:]' < .nvmrc)"
          expected_npm="$(node -p "require('./package.json').packageManager.replace('npm@', '')")"
          echo "node $(node --version) (expected $expected_node), npm $(npm --version) (expected $expected_npm)"
          test "$(node --version)" = "$expected_node"
          test "$(npm --version)" = "$expected_npm"

      - name: Install exact locked dependencies
        run: npm ci

      - name: Format, lint, typecheck and test
        run: npm run verify
